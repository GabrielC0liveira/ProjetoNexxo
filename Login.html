<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="img/favicon-16x16.png" type="image/x-icon">
    <link
        href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <title>Login | Nexxo</title>
</head>

<body>

    <main>
        <!-- onda -->
        <section class="Login">
            <svg class="OndaLogin OndaLoginTopo" viewBox="0 0 1440 120" preserveAspectRatio="none">

                <path d="
            M0,60
            C100,130 180,10 280,55
            C390,110 450,120 540,55
            C650,-20 780,0 870,55
            C980,120 1080,110 1170,45
            C1270,-20 1360,100 1440,45
            L1440,120
            L0,120
            Z
        " />
            </svg>
            <div class="DadosLogin">

                <div class="CaixaLogin">
                    <div class="TopoLogin">
                        <h2>Seja bem vindo novamente!!</h2>
                        <a href="index.html" class="LinkHome">
                            <i class="fa-solid fa-house"></i>
                        </a>
                    </div>

                    <div class="Formulario">
                        <div class="Campo">
                            <label for="usuario">Usuário</label>
                            <input type="text" id="usuario">
                        </div>

                        <div class="Campo">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha">
                        </div>

                        <button class="AcessarConta" type="submit">Acessar Conta</button>
                    </div>

                    <div class="ContaGoogle">
                        <p class="EntrarCriarConta">Não possui conta? <a href="CriarConta.html">Criar uma Agora!</a></p>

                        <button class="Google">
                            <i class="fa-brands fa-google"></i>
                            Entrar com Google</button>
                    </div>
                </div>
            </div>
            <div class="ImgLogin">
                <img src="img/ImgFundoLogin.png" alt="">
            </div>

            <svg class="OndaLogin OndaLoginBaixo" viewBox="0 0 1440 120" preserveAspectRatio="none">

                <path d="
            M0,60
            C100,130 180,10 280,55
            C390,110 450,120 540,55
            C650,-20 780,0 870,55
            C980,120 1080,110 1170,45
            C1270,-20 1360,100 1440,45
            L1440,120
            L0,120
            Z
        " />
            </svg>
        </section>

        <!-- onda -->
    </main>

</body>

</html>
