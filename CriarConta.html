<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="img/favicon-16x16.png" type="image/x-icon">
    <link
        href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <title>Criar Conta | Nexxo</title>
</head>

<body>

    <main>

        <section class="CriarConta">
            <svg class="LinhasDecorativas" viewBox="0 0 1400 600" preserveAspectRatio="none">

                <path d="M0 520
           C180 430, 320 360, 480 280
           C650 195, 770 80, 900 0
           C1050 -80, 1190 20, 1400 100" class="LinhaDecorativa LinhaEscura">
                </path>

                <path d="M0 570
           C220 500, 390 430, 560 340
           C730 250, 850 180, 980 90
           C1120 0, 1260 -40, 1400 20" class="LinhaDecorativa LinhaRoxa">
                </path>

                <path d="M0 600
           C200 560, 420 520, 620 470
           C820 420, 1000 350, 1140 260
           C1250 190, 1340 110, 1400 40" class="LinhaDecorativa LinhaClara">
                </path>

            </svg>
            <svg class="OndaLogin OndaLoginTopo" viewBox="0 0 1440 120" preserveAspectRatio="none">

                <path d="
            M0,60
            C100,130 180,10 280,55
            C390,110 450,120 540,55
            C650,-20 780,0 870,55
            C980,120 1080,110 1170,45
            C1270,-20 1360,100 1440,45
            L1440,120
            L0,120
            Z
        " />
            </svg>

            <div class="Cadastro">
                <div class="TopoCadastro">

                    <div class="TituloCadastro">
                        <h2>Crie sua conta!</h2>
                        <a href="index.html" class="LinkHome">
                            <i class="fa-solid fa-house"></i>
                        </a>
                    </div>

                    <p>Preencha os dados para efetuar seu cadastro</p>
                </div>

                <div class="FormularioConta">
                    <div class="Campo CampoNome">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome">
                    </div>

                    <div class="Campo CampoCpf">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf">
                    </div>

                    <div class="Campo CampoTelefone">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone">
                    </div>

                    <div class="Campo CampoEmail">
                        <label for="email">Email</label>
                        <input type="email" id="email">
                    </div>

                    <div class="Campo CampoSenha">
                        <label for="senha">Crie uma senha</label>
                        <input type="password" id="senha">
                    </div>

                    <div class="Campo CampoConfirmarSenha">
                        <label for="confirmarSenha">Confirme sua senha</label>
                        <input type="password" id="confirmarSenha">
                    </div>

                    <button class="BotaoCriarConta" type="submit">Criar Conta</button>
                </div>
                <p class="EntrarLogin">Já possui conta? <a href="Login.html">Fazer Login!</a></p>

            </div>
            <svg class="OndaLogin OndaLoginBaixo" viewBox="0 0 1440 120" preserveAspectRatio="none">

                <path d="
            M0,60
            C100,130 180,10 280,55
            C390,110 450,120 540,55
            C650,-20 780,0 870,55
            C980,120 1080,110 1170,45
            C1270,-20 1360,100 1440,45
            L1440,120
            L0,120
            Z
        " />
            </svg>
        </section>
    </main>
</body>

</html>
